<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>试剂柜 · 手机认证</title>
<style>
  :root{
    --bg:#05070f;
    --glass:rgba(255,255,255,.055);
    --glass-strong:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.12);
    --line-soft:rgba(255,255,255,.07);
    --text:#e8edf7;
    --sub:#93a1b8;
    --cyan:#22d3ee;
    --violet:#8b5cf6;
    --pink:#f472b6;
    --green:#34d399;
    --red:#f87171;
    --amber:#fbbf24;
    --grad:linear-gradient(120deg,var(--cyan),var(--violet) 55%,var(--pink));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    margin:0;color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg);overflow-x:hidden;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  /* ---------- 极光背景 ---------- */
  .aurora{position:fixed;inset:0;z-index:-2;overflow:hidden}
  .aurora i{position:absolute;display:block;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
  .aurora i:nth-child(1){width:60vw;height:60vw;left:-18vw;top:-16vw;background:#0ea5e9;animation-delay:-2s}
  .aurora i:nth-child(2){width:52vw;height:52vw;right:-16vw;top:6vh;background:#7c3aed;animation-delay:-7s}
  .aurora i:nth-child(3){width:46vw;height:46vw;left:12vw;bottom:-20vh;background:#db2777;opacity:.35;animation-delay:-12s}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6vw,4vh,0) scale(1.12)}}
  .grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);
  }
  /* ---------- 布局 ---------- */
  .wrap{max-width:560px;margin:0 auto;padding:26px 16px 40px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(145deg,rgba(34,211,238,.25),rgba(139,92,246,.3));
    border:1px solid rgba(140,190,255,.35);box-shadow:0 0 24px rgba(56,189,248,.35), inset 0 0 12px rgba(255,255,255,.08)}
  h1{font-size:21px;margin:0;letter-spacing:.5px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--sub);font-size:12px;margin:2px 0 18px 56px}
  /* 状态胶囊 */
  #state{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:18px 16px;border-radius:18px;text-align:center;
    font-size:17px;font-weight:600;letter-spacing:.3px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
    border:1px solid var(--line);
    box-shadow:0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  #state::before{content:"";width:10px;height:10px;border-radius:50%;
    background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
  /* lease 计时 */
  .lease-row{display:flex;align-items:center;justify-content:space-between;
    margin:14px 2px 4px;padding:12px 16px;border-radius:14px;
    background:var(--glass);border:1px solid var(--line-soft)}
  .lease-row .label{color:var(--sub);font-size:13px}
  #lease{font-size:26px;font-weight:800;letter-spacing:1px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums}
  .hint{color:var(--sub);font-size:11.5px;line-height:1.55;margin:8px 4px 0}
  /* 卡片 */
  .card{margin-top:16px;padding:16px 14px;border-radius:18px;
    background:var(--glass);border:1px solid var(--line-soft);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 28px rgba(0,0,0,.30);position:relative;overflow:hidden;
    transition:border-color .25s, box-shadow .25s}
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(420px 160px at var(--mx,50%) var(--my,0%),rgba(120,180,255,.16),transparent 60%)}
  .card:hover::before{opacity:1}
  .card h2{margin:0 0 12px;font-size:13.5px;font-weight:600;color:var(--sub);letter-spacing:.6px;
    display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:14px;border-radius:4px;background:var(--grad)}
  /* 按钮 */
  .btn{border:1px solid var(--line);background:var(--glass-strong);color:var(--text);
    padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;
    transition:transform .12s, box-shadow .25s, background .25s, border-color .25s;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
  .btn:active{transform:scale(.97)}
  .btn-primary{border:0;color:#04121c;font-weight:700;
    background:linear-gradient(120deg,#67e8f9,#22d3ee 40%,#a78bfa);
    box-shadow:0 6px 22px rgba(34,211,238,.35), inset 0 1px 0 rgba(255,255,255,.5)}
  .btn-primary:hover{box-shadow:0 8px 30px rgba(34,211,238,.55)}
  .btn-ghost:hover{border-color:rgba(120,190,255,.5);background:rgba(120,190,255,.08)}
  .btn-danger{color:#fecaca;border-color:rgba(248,113,113,.35)}
  .btn-danger:hover{background:rgba(248,113,113,.12)}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  .btns .btn{flex:1 1 44%}
  .btns .btn.wide{flex-basis:100%}
  /* 输入 */
  select,input[type=number]{
    width:100%;padding:11px 12px;border-radius:12px;min-height:44px;
    background:rgba(8,12,24,.7);border:1px solid var(--line);color:var(--text);
    font-size:14px;outline:none;transition:border-color .2s, box-shadow .2s}
  select:focus,input[type=number]:focus{border-color:rgba(103,232,249,.6);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
  .field{display:flex;gap:10px;align-items:center}
  .field .grow{flex:1}
  /* 开关（独立胶囊行） */
  .switch{display:flex;align-items:center;gap:12px;margin-top:12px;padding:11px 16px;
    border-radius:12px;background:rgba(8,12,24,.5);border:1px solid var(--line-soft);
    color:var(--text);font-size:14px;cursor:pointer;user-select:none;white-space:nowrap;
    width:100%;transition:border-color .2s, background .2s}
  .switch:hover{border-color:rgba(120,190,255,.35);background:rgba(120,190,255,.06)}
  .switch input{appearance:none;flex:none;width:44px;height:26px;border-radius:99px;background:#1b2438;
    border:1px solid var(--line);position:relative;cursor:pointer;transition:background .25s;margin:0}
  .switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:#8fa3c0;transition:transform .25s, background .25s}
  .switch input:checked{background:rgba(34,211,238,.25);border-color:rgba(34,211,238,.5)}
  .switch input:checked::after{transform:translateX(18px);background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .switch .sw-hint{margin-left:auto;color:var(--sub);font-size:12px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 终端日志 */
  .log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  #log{
    height:250px;overflow-y:auto;padding:12px 14px;border-radius:14px;
    background:rgba(3,6,14,.85);border:1px solid var(--line-soft);
    font-family:"Cascadia Code",Consolas,monospace;font-size:12px;line-height:1.6;
    color:#9be7c4;white-space:pre-wrap;word-break:break-all;
    box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
  #log::-webkit-scrollbar{width:6px}
  #log::-webkit-scrollbar-thumb{background:rgba(120,160,220,.25);border-radius:6px}
  .foot{text-align:center;color:rgba(147,161,184,.6);font-size:11px;margin-top:22px;letter-spacing:.3px}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="grid"></div>

<div class="wrap">
  <div class="brand">
    <div class="logo">🧪</div>
    <div>
      <h1>试剂柜 · 手机认证</h1>
      <div class="tagline">BLE 双人授权 · 挑战应答 · 分级管控</div>
    </div>
  </div>

  <div id="state">未连接</div>

  <div class="lease-row">
    <span class="label">监督人 lease 倒计时</span>
    <span id="lease">--</span>
  </div>
  <div class="hint">T-06c 口径：连接发起 → 挑战-应答完成 ≤ 3000ms　｜　GATT 契约 FFE0~FFE6</div>

  <section class="card">
    <h2>连接</h2>
    <div class="btns">
      <button class="btn btn-primary wide" id="btnConn">扫描并连接试剂柜</button>
      <button class="btn btn-ghost wide" id="btnDisc">断开连接</button>
    </div>
    <label class="switch">
      <input type="checkbox" id="autoEcho" checked>
      <span>自动回应答</span>
      <span class="sw-hint">关闭后可测超时/重放负例</span>
    </label>
  </section>

  <section class="card">
    <h2>身份认证</h2>
    <div class="btns">
      <button class="btn btn-primary" id="btnOp">取用人认证</button>
      <button class="btn btn-primary" id="btnSup">监督人授权</button>
      <button class="btn btn-ghost" id="btnEcho">立即回写挑战</button>
      <button class="btn btn-ghost" id="btnSlow">12 秒后回写</button>
      <button class="btn btn-ghost wide" id="btnReplay">发旧应答（重放负例）</button>
    </div>
  </section>

  <section class="card">
    <h2>试剂选择</h2>
    <div class="field">
      <select id="reagent" class="grow">
        <option value="1">1 · 乙醇（普通）</option>
        <option value="2">2 · 丙酮（普通）</option>
        <option value="3">3 · 浓硫酸（高危 · 双人）</option>
        <option value="4">4 · 高锰酸钾（高危 · 双人）</option>
      </select>
      <button class="btn btn-primary" id="btnReagent">写入</button>
    </div>
  </section>

  <section class="card">
    <h2>身份绑定 <span style="font-weight:400;color:rgba(147,161,184,.7)">（先开绑定窗口）</span></h2>
    <div class="field">
      <input id="bindUid" type="number" value="2" min="1" max="12" class="grow" placeholder="人员编号">
      <button class="btn btn-primary" id="btnBind">绑定手机</button>
    </div>
  </section>

  <section class="card">
    <div class="log-head">
      <h2 style="margin:0">运行日志</h2>
      <button class="btn btn-ghost" style="min-height:34px;padding:6px 12px" id="btnClear">清空</button>
    </div>
    <div id="log"></div>
  </section>

  <div class="foot">试剂柜分级安防系统 · Web Bluetooth POC</div>
</div>

<script>
const SVC = 0xFFE0, AUTH_REQ = 0xFFE1, CHALLENGE = 0xFFE2, AUTH_RESP = 0xFFE3,
      REAGENT_SEL = 0xFFE4, STATUS = 0xFFE5, BIND_REQ = 0xFFE6;
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(m) {
  const t = new Date();
  const ts = t.toTimeString().slice(0,8) + '.' + String(t.getMilliseconds()).padStart(3,'0');
  logEl.textContent += `[${ts}] ${m}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}
function hex(u8) { return [...u8].map(b => b.toString(16).padStart(2,'0')).join(' ').toUpperCase(); }

let dev = null, gatt = null, svc = null;
let chChallenge, chStatus, chAuthReq, chAuthResp, chReagent, chBind;
let lastChallenge = null, prevResp = null;
let tConnStart = 0, tConnDone = 0, tAuthReq = 0;
let leaseTimer = null;

async function connect() {
  try {
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'ReagentCab' }],
      optionalServices: [SVC]
    });
    log('已选择设备: ' + dev.name);
    dev.addEventListener('gattserverdisconnected', onDisconnected);
    tConnStart = performance.now();
    $('state').textContent = '连接中…';
    gatt = await dev.gatt.connect();
    tConnDone = performance.now();
    log(`GATT 已连接，耗时 ${(tConnDone - tConnStart).toFixed(0)}ms`);
    svc = await gatt.getPrimaryService(SVC);
    [chAuthReq, chChallenge, chAuthResp, chReagent, chStatus, chBind] = await Promise.all([
      svc.getCharacteristic(AUTH_REQ), svc.getCharacteristic(CHALLENGE),
      svc.getCharacteristic(AUTH_RESP), svc.getCharacteristic(REAGENT_SEL),
      svc.getCharacteristic(STATUS), svc.getCharacteristic(BIND_REQ)
    ]);
    await chChallenge.startNotifications();
    chChallenge.addEventListener('characteristicvaluechanged', onChallenge);
    await chStatus.startNotifications();
    chStatus.addEventListener('characteristicvaluechanged', onStatus);
    $('state').textContent = '已连接 ' + dev.name;
    log('✓ GATT 就绪，FFE0~FFE6 特征全部获取');
  } catch (e) {
    $('state').textContent = '连接失败';
    log('✗ ' + e.message);
  }
}

function onDisconnected() {
  $('state').textContent = '已断开';
  log('✗ gattserverdisconnected（若正处 lease：断连即失效）');
  stopLease();
}

async function onChallenge(e) {
  const v = e.target.value;
  lastChallenge = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  log('收到挑战(FFE2): ' + hex(lastChallenge));
  if ($('autoEcho').checked) {
    await echoNow();
  } else {
    log('（自动回应答已关 → 用"立即回写"/"12秒后回写"手动测）');
  }
}

async function echoNow() {
  if (!lastChallenge) return log('尚无挑战');
  try {
    prevResp = lastChallenge;
    await chAuthResp.writeValue(prevResp);
    log('应答已写入(FFE3)，等待 STATUS…');
  } catch (e) {
    log('✗ 应答写入失败: ' + (e.message || e));
  }
}

function onStatus(e) {
  const s = new TextDecoder().decode(e.target.value);
  log('状态(FFE5): ' + s);
  $('state').textContent = s;
  if (s.startsWith('AUTH_OK') || s.startsWith('SUPERVISOR_OK')) {
    const total = (performance.now() - tConnStart).toFixed(0);
    const auth = (performance.now() - tAuthReq).toFixed(0);
    log(`⏱ 计时：认证耗时 ${auth}ms；连接→应答完成(T-06c口径) ${total}ms ${total <= 3000 ? '✓达标' : '✗超3s'}`);
    if (s.startsWith('SUPERVISOR_OK')) {
      const m = s.match(/lease=(\d+)/);
      startLease(m ? +m[1] : 60);
    }
  } else if (s.startsWith('AUTH_FAIL') || s.startsWith('BIND_FAIL')) {
    log('→ 认证失败（若正按计划跑负例则符合预期）');
  } else if (s.startsWith('LEASE,sec=')) {
    $('lease').textContent = s.split('=')[1] + 's';
  } else if (s.startsWith('LEASE,')) {
    stopLease(); $('lease').textContent = s.split(',')[1];
  } else if (s.startsWith('REAGENT') || s.startsWith('BIND_OK')) {
    log('→ 已记录');
  }
}

function startLease(sec) {
  stopLease();
  let left = sec;
  $('lease').textContent = left + 's';
  leaseTimer = setInterval(() => {
    left--;
    $('lease').textContent = left > 0 ? left + 's' : '0s（等设备确认过期）';
    if (left <= 0) stopLease();
  }, 1000);
}
function stopLease() { if (leaseTimer) { clearInterval(leaseTimer); leaseTimer = null; } }

async function authReq(role) {
  if (!chAuthReq) return log('未连接');
  try {
    tAuthReq = performance.now();
    await chAuthReq.writeValue(Uint8Array.of(role));
    log(`AUTH_REQ 已写入 role=${role ? '监督人' : '取用人'}，等待挑战…`);
  } catch (e) {
    log('✗ 写入失败: ' + (e.message || e) + '（若提示 security/auth：Windows 正在配对，稍等或到 设置→蓝牙 里完成配对）');
  }
}

$('btnConn').onclick = () => connect().catch(e => log('✗ 连接异常: ' + (e.message || e)));
$('btnDisc').onclick = () => { if (gatt?.connected) gatt.disconnect(); };
$('btnOp').onclick = () => authReq(0);
$('btnSup').onclick = () => authReq(1);
$('btnEcho').onclick = echoNow;
$('btnSlow').onclick = () => {
  if (!lastChallenge) return log('尚无挑战');
  log('12 秒后自动回写（挑战 TTL=10s，预期 AUTH_FAIL,expired）…');
  setTimeout(echoNow, 12000);
};
$('btnReplay').onclick = async () => {
  if (!prevResp) return log('尚无可重放的旧应答');
  await chAuthResp.writeValue(prevResp);
  log('旧应答已写入（预期 AUTH_FAIL,replay + 设备告警"重放攻击"）');
};
$('btnReagent').onclick = async () => {
  await chReagent.writeValue(Uint8Array.of(+$('reagent').value));
  log('REAGENT_SEL 已写入 ' + $('reagent').value);
};
$('btnBind').onclick = async () => {
  await chBind.writeValue(Uint8Array.of(+$('bindUid').value));
  log('BIND_REQ 已写入 uid=' + $('bindUid').value + '（需串口已开绑定窗口）');
};
$('btnClear').onclick = () => logEl.textContent = '';

// 卡片聚光跟随
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    card.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
});

log('就绪。提示：Android Chrome 需开定位服务；本页须经 HTTPS 或 localhost 打开');
</script>
</body>
</html>
